        <style>:root { --cream: #FBF1DF; --ink: #241A11; --ink-soft: rgba(36,26,17,0.62); --saffron: #C4842A; --saffron-deep: #8F5D1B; --line: rgba(36,26,17,0.13); } * { box-sizing: border-box; margin: 0; padding: 0; } html { scroll-behavior: smooth; } body { font-family: 'Vazirmatn', sans-serif; background: var(--cream); color: var(--ink); line-height: 1.75; -webkit-font-smoothing: antialiased; } @media (prefers-reduced-motion: reduce){ * {  animation-duration: 0.01ms !important;  transition-duration: 0.01ms !important; } } .wrap { max-width: 820px; margin: 0 auto; padding: 0 24px; } .tile-divider { height: 20px; width: 100%; background-image: radial-gradient(circle at 11px 11px, var(--saffron) 0 3.5px, transparent 4px); background-size: 22px 22px; background-position: center; opacity: 0.4; } /* ---------- HERO ---------- */.hero { position: relative; background: var(--ink); color: var(--cream); padding: 76px 0 62px; text-align: center; } .samovar { width: 60px; height: 60px; margin: 0 auto 22px; opacity: 0.9; } .eyebrow { font-size: 15px; letter-spacing: 0.16em; color: var(--saffron); font-weight: 700; margin-bottom: 16px; } .hero h1 { font-family: 'Lalezar', 'Vazirmatn', sans-serif; font-weight: 400; font-size: clamp(64px, 13vw, 108px); color: #fff; line-height: 1.05; margin-bottom: 16px; } .hero .sub { font-size: clamp(17px, 2.6vw, 20px); font-weight: 400; color: rgba(251,241,223,0.82); max-width: 480px; margin: 0 auto 36px; } .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; } .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; border-radius: 10px; font-weight: 700; font-size: 16px; text-decoration: none; border: 1.5px solid transparent; transition: transform 0.18s ease, opacity 0.18s ease; } .btn:hover { transform: translateY(-2px); } .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; } .btn-insta { background: var(--saffron); color: var(--ink); } .btn-insta:hover { opacity: 0.92; } .btn-insta svg { width: 19px; height: 19px; } .btn-phone { background: transparent; border-color: rgba(251,241,223,0.5); color: #fff; } .btn-phone:hover { background: rgba(251,241,223,0.1); } .btn-phone svg { width: 18px; height: 18px; } /* ---------- NAV ---------- */.quicknav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 20px 24px; background: var(--cream); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; } .quicknav a { font-size: 15px; font-weight: 600; color: var(--ink-soft); text-decoration: none; padding: 8px 18px; border-radius: 8px; transition: color 0.15s ease, background 0.15s ease; } .quicknav a:hover { color: var(--ink); background: var(--line); } .quicknav a:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; } /* ---------- SECTIONS ---------- */section.menu { padding: 68px 0 16px; } .section-head { margin-bottom: 38px; } .section-head .kicker { font-size: 14px; font-weight: 700; letter-spacing: 0.06em; color: var(--saffron-deep); margin-bottom: 8px; } .section-head h2 { font-family: 'Lalezar', sans-serif; font-weight: 400; font-size: clamp(36px, 6vw, 48px); color: var(--ink); } .section-head p { max-width: 460px; font-size: 15.5px; color: var(--ink-soft); margin-top: 8px; } .subgroup-label { font-weight: 700; font-size: 14px; letter-spacing: 0.04em; color: var(--ink-soft); text-transform: uppercase; margin: 38px 0 4px; } .subgroup-label:first-of-type { margin-top: 0; } /* Item: title + price ALWAYS share the top line, at every screen size.
     Description flows full-width underneath. Price never drops to its own row. */.item { padding: 18px 0; border-bottom: 1px solid var(--line); } .item:last-child { border-bottom: none; } .item-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; } .item-title { font-weight: 700; font-size: 18px; color: var(--ink); min-width: 0; } .item-price { flex: 0 0 auto; font-weight: 700; font-size: 16px; color: var(--saffron-deep); white-space: nowrap; font-variant-numeric: tabular-nums; } .item-price .unit { font-size: 11px; font-weight: 600; margin-inline-start: 2px; } .item-desc { font-size: 14px; color: var(--ink-soft); margin-top: 4px; } /* ---------- FOOTER ---------- */footer { background: var(--ink); color: var(--cream); text-align: center; padding: 64px 24px 46px; margin-top: 50px; } footer h3 { font-family: 'Lalezar', sans-serif; font-weight: 400; font-size: 34px; margin-bottom: 12px; color: #fff; } footer p { color: rgba(251,241,223,0.72); font-size: 15px; margin-bottom: 30px; } .footer-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; } .footer-actions .btn-phone { border-color: rgba(251,241,223,0.4); } .footnote { margin-top: 34px; font-size: 13px; color: rgba(251,241,223,0.4); } .load-msg { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-size: 15px; } @media (max-width:480px){ .hero {  padding: 56px 0 46px; }  section.menu {  padding: 50px 0 8px; }  .item-title {  font-size: 17px; }  .item-price {  font-size: 15px; } }</style>

                <a class="btn btn-insta" id="instaBtnFooter" href="#" target="_blank" rel="noopener"> <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <rect x="2" y="2" width="20" height="20" rx="6" stroke="#241A11" stroke-width="1.8"/>

        behrouzbreakfastcafe@ </a>
                <a class="btn btn-phone" id="phoneBtnFooter" href="#"> <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.9c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1.1L6.6 10.8z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
                    </svg> <span id="phoneTextFooter"></span> </a>

        <script>
  function fmtPrice(price){
    if (price === null || price === undefined) {
      return '<span class="item-price">—</span>';
    }
    var formatted = Number(price).toLocaleString('fa-IR');
    return '<span class="item-price">' + formatted + '<span class="unit"> ت</span></span>';
  }

  function escapeHtml(str){
    if (!str) return '';
    return str.replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function renderMenu(data){
    document.getElementById('cafeName').textContent = data.cafeName || 'بهروز';
    document.getElementById('tagline').textContent = data.tagline || '';

    ['instaBtnHero','instaBtnFooter'].forEach(function(id){
      document.getElementById(id).href = data.instagramUrl || '#';
    });
    ['phoneBtnHero','phoneBtnFooter'].forEach(function(id){
      document.getElementById(id).href = 'tel:' + (data.phone || '');
    });
    document.getElementById('phoneTextHero').textContent = data.phoneDisplay || data.phone || '';
    document.getElementById('phoneTextFooter').textContent = data.phoneDisplay || data.phone || '';

    var nav = document.getElementById('quicknav');
    nav.innerHTML = (data.sections || []).map(function(sec){
      return '<a href="#' + sec.id + '">' + escapeHtml(sec.navLabel) + '</a>';
    }).join('');

    var root = document.getElementById('menuRoot');
    root.innerHTML = (data.sections || []).map(function(sec, idx){
      var groupsHtml = (sec.groups || []).map(function(group){
        var labelHtml = group.label ? '<div class="subgroup-label">' + escapeHtml(group.label) + '</div>' : '';
        var itemsHtml = (group.items || []).map(function(item){
          return (
            '<div class="item">' +
              '<div class="item-head">' +
                '<div class="item-title">' + escapeHtml(item.title) + '</div>' +
                fmtPrice(item.price) +
              '</div>' +
              (item.desc ? '<div class="item-desc">' + escapeHtml(item.desc) + '</div>' : '') +
            '</div>'
          );
        }).join('');
        return labelHtml + itemsHtml;
      }).join('');

      var dividerBefore = idx > 0 ? '<div class="tile-divider"></div>' : '';

      return (
        dividerBefore +
        '<section class="menu" id="' + sec.id + '">' +
          '<div class="section-head">' +
            (sec.kicker ? '<div class="kicker">' + escapeHtml(sec.kicker) + '</div>' : '') +
            '<h2>' + escapeHtml(sec.title) + '</h2>' +
            (sec.subtitle ? '<p>' + escapeHtml(sec.subtitle) + '</p>' : '') +
          '</div>' +
          groupsHtml +
        '</section>'
      );
    }).join('');
  }

  fetch('menu-data.json')
    .then(function(res){
      if (!res.ok) throw new Error('menu-data.json not found');
      return res.json();
    })
    .then(renderMenu)
    .catch(function(err){
      document.getElementById('menuRoot').innerHTML =
        '<div class="load-msg">منو در دسترس نیست. مطمئن شوید فایل menu-data.json کنار همین صفحه قرار دارد.</div>';
      console.error(err);
    });
</script>
